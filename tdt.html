<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>天地图组件</title>
    <script
      type="text/javascript"
      src="http://api.tianditu.gov.cn/api?v=4.0&tk=13f1ff3b1c59a59cea87cf63950b4888"
    ></script>
    <script>
      var map;
      var zoom = 10;
      function onLoad() {
        map = new T.Map("mapDiv");
        map.centerAndZoom(new T.LngLat(120.8, 27.8), zoom);
      }
    </script>
  </head>
  <body onLoad="onLoad()">
    <div id="mapDiv" style="position: absolute; width: 96%; height: 90vh"></div>
  </body>
</html>
