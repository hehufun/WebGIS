<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <title>天地图－地图API－范例－地图类型控件</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      #map {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
      }
    </style>
    <script
      type="text/javascript"
      src="https://api.tianditu.gov.cn/api?v=4.0&tk=13f1ff3b1c59a59cea87cf63950b4888"
    ></script>
  </head>
  <body>
    <div id="map"></div>
    <script>
      //初始化地图对象
      map = new T.Map("map");
      //设置显示地图的中心点和级别
      map.centerAndZoom(new T.LngLat(120.8, 27.8), 12);
      //创建对象
      var ctrl = new T.Control.MapType();
      //添加控件
      map.addControl(ctrl);
      //创建比例尺控件对象
      var scale = new T.Control.Scale();
      //添加比例尺控件
      map.addControl(scale);
    </script>
  </body>
</html>
